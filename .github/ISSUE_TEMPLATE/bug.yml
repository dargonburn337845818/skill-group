name: Bug report
description: 报告插件或技能内容的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 请描述问题现象
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出最小可复现步骤
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: DSH / Node 版本等
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
